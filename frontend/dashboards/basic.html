<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RL Market Making - Training Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            color: #888;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            color: #667eea;
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .symbols-section, .runs-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background: #f8f9fa;
            color: #667eea;
            font-weight: 600;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .status-ready {
            background: #d4edda;
            color: #155724;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .refresh-btn:hover {
            background: #5568d3;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .last-updated {
            color: #666;
            font-size: 0.9em;
            text-align: right;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 RL Market Making Dashboard</h1>
            <p class="subtitle">訓練進度監控與模型管理</p>
        </header>
        
        <div id="loading" class="loading">
            <p>載入中...</p>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="dashboard" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>總計幣種</h3>
                    <div class="value" id="total-symbols">-</div>
                </div>
                <div class="stat-card">
                    <h3>已訓練模型</h3>
                    <div class="value" id="total-models">-</div>
                </div>
                <div class="stat-card">
                    <h3>最佳平均PnL</h3>
                    <div class="value" id="best-pnl">$-</div>
                </div>
                <div class="stat-card">
                    <h3>平均成功率</h3>
                    <div class="value" id="avg-success">-%</div>
                </div>
            </div>
            
            <div class="symbols-section">
                <h2>幣種概覽</h2>
                <button class="refresh-btn" onclick="loadDashboard()">🔄 刷新數據</button>
                <table id="symbols-table">
                    <thead>
                        <tr>
                            <th>幣種</th>
                            <th>訓練次數</th>
                            <th>成功率</th>
                            <th>最佳PnL</th>
                            <th>最佳評分</th>
                            <th>狀態</th>
                        </tr>
                    </thead>
                    <tbody id="symbols-tbody">
                    </tbody>
                </table>
            </div>
            
            <div class="runs-section">
                <h2>最近訓練紀錄</h2>
                <table id="runs-table">
                    <thead>
                        <tr>
                            <th>Run ID</th>
                            <th>幣種</th>
                            <th>狀態</th>
                            <th>PnL</th>
                            <th>評分</th>
                            <th>時間</th>
                        </tr>
                    </thead>
                    <tbody id="runs-tbody">
                    </tbody>
                </table>
            </div>
            
            <div class="last-updated">
                最後更新: <span id="last-updated">-</span>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:5555/api';
        
        async function loadDashboard() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('error').style.display = 'none';
                document.getElementById('dashboard').style.display = 'none';
                
                const response = await fetch(`${API_URL}/dashboard`);
                if (!response.ok) {
                    throw new Error('Failed to load dashboard data');
                }
                
                const data = await response.json();
                renderDashboard(data);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = `錯誤: ${error.message}. 請確認 API 服務器已啟動 (python monitoring_dashboard.py --mode server)`;
            }
        }
        
        function renderDashboard(data) {
            // Update stats
            document.getElementById('total-symbols').textContent = data.total_symbols;
            
            const modelsReady = data.symbols.filter(s => s.best_run).length;
            document.getElementById('total-models').textContent = modelsReady;
            
            const bestPnls = data.symbols
                .filter(s => s.best_run)
                .map(s => s.best_run.mean_pnl);
            const bestPnl = bestPnls.length > 0 ? Math.max(...bestPnls) : 0;
            document.getElementById('best-pnl').textContent = `$${bestPnl.toFixed(2)}`;
            
            const successRates = data.symbols.map(s => 
                s.total_runs > 0 ? s.successful_runs / s.total_runs : 0
            );
            const avgSuccess = successRates.length > 0 
                ? successRates.reduce((a, b) => a + b, 0) / successRates.length 
                : 0;
            document.getElementById('avg-success').textContent = `${(avgSuccess * 100).toFixed(1)}%`;
            
            // Render symbols table
            const symbolsTbody = document.getElementById('symbols-tbody');
            symbolsTbody.innerHTML = '';
            
            data.symbols.forEach(symbol => {
                const row = document.createElement('tr');
                const successRate = symbol.total_runs > 0 
                    ? (symbol.successful_runs / symbol.total_runs * 100).toFixed(1) 
                    : 0;
                
                const bestPnl = symbol.best_run ? `$${symbol.best_run.mean_pnl.toFixed(2)}` : 'N/A';
                const bestScore = symbol.best_run ? symbol.best_run.composite_score.toFixed(1) : 'N/A';
                
                const status = symbol.best_run 
                    ? '<span class="status-badge status-ready">✅ 已就緒</span>'
                    : '<span class="status-badge status-failed">❌ 無模型</span>';
                
                row.innerHTML = `
                    <td><strong>${symbol.symbol.toUpperCase()}</strong></td>
                    <td>${symbol.total_runs}</td>
                    <td>${successRate}%</td>
                    <td>${bestPnl}</td>
                    <td>${bestScore}</td>
                    <td>${status}</td>
                `;
                symbolsTbody.appendChild(row);
            });
            
            // Render recent runs table
            const runsTbody = document.getElementById('runs-tbody');
            runsTbody.innerHTML = '';
            
            data.recent_runs.forEach(run => {
                const row = document.createElement('tr');
                const runId = run.run_id.substring(0, 25) + '...';
                const pnl = run.mean_pnl !== null ? `$${run.mean_pnl.toFixed(2)}` : 'N/A';
                const score = run.composite_score !== null ? run.composite_score.toFixed(1) : 'N/A';
                
                let statusBadge;
                if (run.status === 'completed') {
                    statusBadge = '<span class="status-badge status-ready">完成</span>';
                } else if (run.status === 'started' || run.status === 'training') {
                    statusBadge = '<span class="status-badge status-pending">進行中</span>';
                } else {
                    statusBadge = '<span class="status-badge status-failed">失敗</span>';
                }
                
                const timestamp = new Date(run.timestamp).toLocaleString('zh-TW');
                
                row.innerHTML = `
                    <td><code>${runId}</code></td>
                    <td><strong>${run.symbol.toUpperCase()}</strong></td>
                    <td>${statusBadge}</td>
                    <td>${pnl}</td>
                    <td>${score}</td>
                    <td>${timestamp}</td>
                `;
                runsTbody.appendChild(row);
            });
            
            // Update timestamp
            document.getElementById('last-updated').textContent = 
                new Date(data.generated_at).toLocaleString('zh-TW');
        }
        
        // Auto refresh every 30 seconds
        setInterval(loadDashboard, 30000);
        
        // Initial load
        loadDashboard();
    </script>
</body>
</html>
