name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rl_user
          POSTGRES_PASSWORD: rl_password
          POSTGRES_DB: rl_market
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Initialize PostgreSQL schema
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: rl_user
          PGPASSWORD: rl_password
          PGDATABASE: rl_market
        run: |
          psql -f scripts/init_db.sql

      - name: Run tests with coverage
        env:
          DB_TYPE: postgresql
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: rl_market
          POSTGRES_USER: rl_user
          POSTGRES_PASSWORD: rl_password
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          pip install ruff black isort

      - name: Run ruff
        run: ruff check . --ignore E501

      - name: Check formatting with black
        run: black --check --diff . || true

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install mypy types-PyYAML types-requests
          pip install -r requirements.txt

      - name: Run mypy
        run: mypy . --ignore-missing-imports || true
