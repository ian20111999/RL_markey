# =============================================================================
# 低方差做市商配置 (env_v3_low_variance.yaml)
# 目標：穩定盈利，降低波動
# =============================================================================

# 基礎環境設定
env:
  id: "MarketMakingEnvV2"
  data_file: "data/btc_usdt_1m_2023.csv"
  
  # 保守的參數設定
  episode_length: 1440              # 1 天
  initial_cash: 10000.0
  max_inventory: 3.0                # 降低最大庫存 (5→3) 減少風險暴露
  random_start: true
  
  # 市場參數
  fee_rate: 0.0004
  base_spread: 25.0

# =============================================================================
# 真實成交模型 - 保守設定
# =============================================================================
fill_model:
  enabled: true
  slippage_bps: 1.5                 # 略高滑點，更保守
  use_queue_position: true
  queue_decay_rate: 0.1
  allow_partial_fills: true
  min_fill_ratio: 0.3
  adverse_selection_prob: 0.35      # 提高逆向選擇，訓練更謹慎
  adverse_selection_cost_bps: 2.0

# =============================================================================
# Reward 配置 - 強調穩定性
# =============================================================================
reward:
  mode: "shaped"
  lambda_inventory: 0.01            # 更強的庫存懲罰 (0.005→0.01)
  lambda_turnover: 0.0002           # 略增刷單懲罰
  gamma: 0.99

# =============================================================================
# 風險敏感訓練 - 關鍵！
# =============================================================================
risk_sensitive:
  enabled: true
  risk_type: "downside_variance"    # 只懲罰下行波動
  risk_lambda: 0.15                 # 風險懲罰權重 (0.1→0.15)
  cvar_alpha: 0.05
  
  # 回撤控制
  use_drawdown_early_stopping: true
  max_drawdown_threshold: 0.25      # 更嚴格的回撤限制 (0.3→0.25)

# =============================================================================
# 動態部位限制
# =============================================================================
dynamic_position_limit:
  enabled: true
  volatility_window: 60
  base_volatility: 0.02
  min_inventory_ratio: 0.4          # 高波動時更保守 (0.3→0.4)
  max_inventory_ratio: 1.0

# =============================================================================
# Action 配置
# =============================================================================
action:
  mode: "asymmetric"
  allow_no_quote: false
  max_spread_multiplier: 2.5        # 限制最大價差 (3.0→2.5)
  min_spread_multiplier: 0.5        # 提高最小價差 (0.3→0.5)

# =============================================================================
# 進階觀察空間
# =============================================================================
advanced_observation:
  use_order_flow: true
  order_flow_window: 20
  use_vwap_deviation: true
  vwap_window: 30
  use_momentum: true
  momentum_windows: [5, 15, 60]

# =============================================================================
# Domain Randomization - 增強泛化
# =============================================================================
domain_randomization:
  enabled: true
  fee_rate_range: [0.0003, 0.0006]  # 更大範圍
  base_spread_range: [18.0, 32.0]
  volatility_multiplier_range: [0.7, 1.3]
  fill_probability_noise: 0.08

# =============================================================================
# 訓練配置 - 穩定訓練
# =============================================================================
train:
  algo: "SAC"
  total_timesteps: 200000
  
  # 保守的超參數
  learning_rate: 0.00005            # 更小學習率 (0.0001→0.00005)
  batch_size: 512                   # 更大 batch (256→512)
  buffer_size: 500000
  gamma: 0.99
  tau: 0.002                        # 更慢更新 (0.005→0.002)
  train_freq: 1
  gradient_steps: 1
  ent_coef: "auto"
  
  # 網路架構
  net_arch: [256, 256]
  
  # 訓練設定
  n_envs: 4
  eval_freq: 5000
  n_eval_episodes: 20
  
  # 早停 - 更有耐心
  early_stopping:
    enabled: true
    patience: 20                    # 更多耐心 (15→20)
    min_delta: 30.0                 # 更小改善也算 (50→30)

# =============================================================================
# Sanity Check
# =============================================================================
sanity_criteria:
  min_rl_net_pnl: 50.0              # 至少賺 50
  min_rl_vs_random_gap: 300.0
  min_rl_vs_baseline_gap: 0.0       # 至少要跟 baseline 一樣好

# =============================================================================
# 資料切割
# =============================================================================
data_split:
  train_start: "2023-01-01"
  train_end: "2023-06-30"
  valid_start: "2023-07-01"
  valid_end: "2023-08-31"
  test_start: "2023-09-01"
  test_end: "2023-12-31"

# =============================================================================
# 驗證配置
# =============================================================================
validation:
  walk_forward:
    enabled: true
    n_splits: 5
    train_window_days: 60
    test_window_days: 15
  
  monte_carlo:
    enabled: true
    n_simulations: 1000
    confidence_level: 0.95
  
  robustness:
    enabled: true
    slippage_range: [0.5, 2.0]
    fee_range: [0.5, 2.0]
    volatility_range: [0.5, 2.0]

# =============================================================================
# 實驗標籤
# =============================================================================
run:
  short_name: "low_variance_v1"
  notes: "低方差配置：更強風險懲罰、保守超參數、嚴格回撤控制"
  tags:
    - "low_variance"
    - "risk_sensitive"
    - "conservative"
