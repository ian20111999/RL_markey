# =============================================================================
# MarketMakingEnvV2 配置檔案 (v3 - Professional Market Making)
# 完整的專業做市商環境配置
# =============================================================================

# 基礎環境設定
env:
  id: "MarketMakingEnvV2"
  data_file: "data/btc_usdt_1m_2023.csv"
  
  # 基本參數
  episode_length: 1440              # 1 天 = 1440 分鐘
  initial_cash: 10000.0
  max_inventory: 5.0
  random_start: true
  
  # 市場參數（可被 Domain Randomization 覆寫）
  fee_rate: 0.0004
  base_spread: 25.0

# =============================================================================
# 真實成交模型配置 (RealisticFillModel)
# =============================================================================
fill_model:
  enabled: true
  
  # 滑點設定
  slippage_bps: 1.0                 # 基礎滑點 (basis points)
  max_slippage_bps: 5.0             # 最大滑點
  
  # 隊列位置模擬
  use_queue_position: true
  queue_decay_rate: 0.1             # 隊列位置衰減率
  initial_queue_position: 0.7       # 初始隊列位置 (0-1)
  
  # 部分成交
  allow_partial_fills: true
  min_fill_ratio: 0.3               # 最小成交比例
  
  # 市場影響
  market_impact_factor: 0.1         # 市場影響因子
  
  # 逆向選擇
  adverse_selection_prob: 0.3       # 逆向選擇機率
  adverse_selection_cost_bps: 2.0   # 逆向選擇成本

# =============================================================================
# 進階觀察空間配置
# =============================================================================
advanced_observation:
  # 訂單流特徵
  use_order_flow: true
  order_flow_window: 20             # 訂單流計算窗口
  
  # VWAP 偏離
  use_vwap_deviation: true
  vwap_window: 30                   # VWAP 計算窗口
  
  # 多時間框架動量
  use_momentum: true
  momentum_windows: [5, 15, 60]     # 5分, 15分, 1小時

# =============================================================================
# Reward 配置
# =============================================================================
reward:
  # 模式選擇：dense | sparse | shaped | hybrid
  mode: "shaped"
  
  # Potential-based Shaping 參數
  lambda_inventory: 0.005           # 庫存懲罰係數 (10倍增強: 0.0005 → 0.005)
  lambda_turnover: 0.0001           # 刷單懲罰
  gamma: 0.99                       # 折扣因子（用於 potential shaping）
  
  # Sparse 模式參數
  sparse_scale: 0.01                # Sparse reward 縮放
  
  # Hybrid 模式參數
  terminal_bonus_weight: 0.3        # Terminal bonus 權重

# =============================================================================
# 風險敏感訓練配置
# =============================================================================
risk_sensitive:
  enabled: true
  
  # 風險類型: variance | downside_variance | cvar
  risk_type: "cvar"
  
  # 風險懲罰係數
  risk_lambda: 0.1                  # 風險懲罰權重
  
  # CVaR 設定
  cvar_alpha: 0.05                  # CVaR 尾部風險比例 (5%)
  
  # 風險感知回調
  use_cvar_callback: true
  target_cvar: -500.0               # 目標 CVaR 閾值
  
  # 回撤早停
  use_drawdown_early_stopping: true
  max_drawdown_threshold: 0.3       # 最大允許回撤 30%

# =============================================================================
# Observation 配置
# =============================================================================
observation:
  # 特徵開關
  include_price: true
  include_inventory: true
  include_time: true
  include_volatility: true
  include_momentum: true
  include_volume: true
  include_inventory_age: true
  
  # 波動率計算窗口（分鐘）
  volatility_windows: [5, 15, 60]
  
  # 動量計算窗口（分鐘）
  momentum_windows: [5, 15]

# =============================================================================
# Action 配置
# =============================================================================
action:
  # 模式選擇：symmetric | asymmetric | discrete
  mode: "asymmetric"
  
  # 禁止不報價，強制做市商持續提供流動性
  allow_no_quote: false
  
  # 價差倍數範圍
  max_spread_multiplier: 3.0
  min_spread_multiplier: 0.3

# =============================================================================
# 動態部位限制配置
# =============================================================================
dynamic_position_limit:
  enabled: true
  
  # 波動率閾值
  volatility_window: 60             # 波動率計算窗口 (分鐘)
  base_volatility: 0.02             # 基礎波動率 (2%)
  
  # 部位調整
  min_inventory_ratio: 0.3          # 高波動時最小庫存比例
  max_inventory_ratio: 1.0          # 低波動時最大庫存比例

# =============================================================================
# Domain Randomization 配置
# =============================================================================
domain_randomization:
  # 訓練時啟用，測試時關閉
  enabled: true
  
  # 隨機化範圍
  fee_rate_range: [0.0003, 0.0005]
  base_spread_range: [20.0, 30.0]
  volatility_multiplier_range: [0.8, 1.2]
  fill_probability_noise: 0.05

# =============================================================================
# 訓練配置
# =============================================================================
train:
  # 演算法選擇
  algo: "SAC"
  
  # 訓練步數
  total_timesteps: 300000           # 主要訓練步數
  final_timesteps: 500000           # Final Training 用
  
  # SAC 超參數 - 改善穩定性
  learning_rate: 0.0001             # 降低學習率 (0.0003 → 0.0001)
  batch_size: 256
  buffer_size: 500000               # 增加 buffer (200k → 500k)
  gamma: 0.99
  tau: 0.005                        # 降低 tau (0.02 → 0.005) 更緩慢的目標網路更新
  train_freq: 1
  gradient_steps: 1
  ent_coef: "auto"                  # 自動調整 entropy coefficient
  target_entropy: "auto"            # 自動目標熵
  
  # 網路架構
  net_arch: [256, 256]
  
  # 特徵提取器配置
  feature_extractor:
    type: "mlp"                     # mlp | lstm | transformer | cnn_lstm
    features_dim: 128
    sequence_length: 20
    lstm_hidden_size: 64
    lstm_num_layers: 1
  
  # 訓練設定
  n_envs: 4                         # 平行環境數
  eval_freq: 5000                   # 更頻繁評估 (10k → 5k)
  n_eval_episodes: 20               # 更多評估 episode (5 → 20) 減少方差
  
  # 早停設定
  early_stopping:
    enabled: true
    patience: 15                    # 15 次無改善則停止
    min_delta: 50.0                 # 最小改善幅度

# =============================================================================
# Sanity Check 配置
# =============================================================================
sanity_criteria:
  # 絕對門檻
  min_rl_net_pnl: 0.0               # 至少不虧錢
  
  # 相對門檻（使用差值）
  min_rl_vs_random_gap: 200.0       # 比 Random 好 200
  min_rl_vs_baseline_gap: -100.0    # 允許略低於 Baseline
  
  # 重試設定
  max_retries: 3
  
  # 進階條件
  require_positive_sharpe: false
  skip_tuning_if_exceed_baseline: 1.5

# =============================================================================
# 資料切割
# =============================================================================
data_split:
  train_start: "2023-01-01"
  train_end: "2023-06-30"
  valid_start: "2023-07-01"
  valid_end: "2023-08-31"
  test_start: "2023-09-01"
  test_end: "2023-12-31"

# =============================================================================
# 評估指標配置
# =============================================================================
evaluation:
  # 主要指標（用於比較）
  primary_metrics:
    - net_pnl
    - sharpe
    - max_drawdown
    - calmar_ratio
  
  # 行為指標（用於診斷）
  behavior_metrics:
    - avg_spread
    - fill_rate
    - bid_fill_rate
    - ask_fill_rate
    - quote_rate
    - inventory_turnover
  
  # 風險指標
  risk_metrics:
    - var_95
    - expected_shortfall_95
    - max_inventory_reached
    - time_at_max_inventory_pct
    - adverse_selection_rate

# =============================================================================
# 驗證配置
# =============================================================================
validation:
  # Walk-Forward 分析
  walk_forward:
    enabled: true
    n_splits: 5
    train_window_days: 60           # 60 天訓練窗口
    test_window_days: 15            # 15 天測試窗口
  
  # Monte Carlo 模擬
  monte_carlo:
    enabled: true
    n_simulations: 1000             # 模擬次數
    confidence_level: 0.95          # 信賴區間
  
  # 穩健性測試
  robustness:
    enabled: true
    slippage_range: [0.5, 2.0]      # 滑點範圍倍數
    fee_range: [0.5, 2.0]           # 費用範圍倍數
    volatility_range: [0.5, 2.0]    # 波動率範圍倍數

# =============================================================================
# 集成學習配置
# =============================================================================
ensemble:
  enabled: false                    # 是否使用集成
  n_models: 5                       # 模型數量
  voting_method: "weighted"         # simple | weighted | stacking
  diversity_weight: 0.2             # 多樣性權重

# =============================================================================
# 實驗追蹤
# =============================================================================
run:
  short_name: "v3_professional"
  notes: "專業做市商配置：真實成交模型、風險敏感訓練、進階特徵、完整驗證"
  tags:
    - "v3_professional"
    - "realistic_fill"
    - "risk_sensitive"
    - "advanced_features"
    - "validated"
