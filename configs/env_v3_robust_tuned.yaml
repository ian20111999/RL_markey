# =============================================================================
# MarketMakingEnvV2 配置檔案 (v3_robust_tuned - Extended Training + Tuned Hyperparameters)
# 
# 🆕 基於 v3_robust 的改進:
# 1. 延長訓練步數 200k → 400k
# 2. 針對 16-dim 觀察空間優化 SAC 超參數
# 3. 增加 Early Stopping patience
# 4. 更大的網路架構處理趨勢特徵
# =============================================================================

# 基礎環境設定
env:
  id: "MarketMakingEnvV2"
  data_file: "data/btc_usdt_1m_2023.csv"
  
  # 基本參數
  episode_length: 1440              # 1 天 = 1440 分鐘
  initial_cash: 10000.0
  max_inventory: 5.0
  random_start: true
  
  # 市場參數
  fee_rate: 0.0004
  base_spread: 25.0

# =============================================================================
# 數據增強配置 - 解決 Regime Change 問題
# =============================================================================
data_augmentation:
  enable_price_flip: true           # 價格翻轉

# =============================================================================
# 真實成交模型配置
# =============================================================================
fill_model:
  enabled: true
  slippage_bps: 1.0
  max_slippage_bps: 5.0
  use_queue_position: true
  queue_decay_rate: 0.1
  initial_queue_position: 0.7
  allow_partial_fills: true
  min_fill_ratio: 0.3
  market_impact_factor: 0.1
  adverse_selection_prob: 0.3
  adverse_selection_cost_bps: 2.0

# =============================================================================
# 進階觀察空間配置
# =============================================================================
advanced_observation:
  use_order_flow: true
  order_flow_window: 20
  use_vwap_deviation: true
  vwap_window: 30
  use_momentum: true
  momentum_windows: [5, 15, 60]

# =============================================================================
# Reward 配置
# =============================================================================
reward:
  mode: "shaped"
  lambda_inventory: 0.005
  lambda_turnover: 0.0001
  gamma: 0.99
  sparse_scale: 0.01
  terminal_bonus_weight: 0.3

# =============================================================================
# 風險敏感訓練配置
# =============================================================================
risk_sensitive:
  enabled: true
  risk_type: "cvar"
  risk_lambda: 0.1
  cvar_alpha: 0.05
  use_cvar_callback: true
  target_cvar: -500.0
  use_drawdown_early_stopping: true
  max_drawdown_threshold: 0.3

# =============================================================================
# Observation 配置 - 16 維觀察空間（含趨勢特徵）
# =============================================================================
observation:
  include_price: true
  include_inventory: true
  include_time: true
  include_volatility: true
  include_momentum: true
  include_volume: true
  include_inventory_age: true
  
  # 趨勢特徵 - 幫助模型感知市場狀態
  include_trend: true
  trend_windows: [60, 240, 1440]    # 1小時, 4小時, 1天 SMA
  
  volatility_windows: [5, 15, 60]
  momentum_windows: [5, 15]

# =============================================================================
# Action 配置
# =============================================================================
action:
  mode: "asymmetric"
  allow_no_quote: false
  max_spread_multiplier: 3.0
  min_spread_multiplier: 0.3

# =============================================================================
# 動態部位限制配置
# =============================================================================
dynamic_position_limit:
  enabled: true
  volatility_window: 60
  base_volatility: 0.02
  min_inventory_ratio: 0.3
  max_inventory_ratio: 1.0

# =============================================================================
# Domain Randomization 配置
# =============================================================================
domain_randomization:
  enabled: true
  fee_rate_range: [0.0002, 0.0006]
  base_spread_range: [15.0, 40.0]
  volatility_multiplier_range: [0.6, 1.5]
  fill_probability_noise: 0.1

# =============================================================================
# 🆕 訓練配置 - 延長訓練 + 超參數調優
# =============================================================================
train:
  algo: "SAC"
  
  # 🆕 延長訓練步數
  total_timesteps: 400000           # 200k → 400k
  final_timesteps: 600000           # Final Training
  
  # 🆕 SAC 超參數調優 (針對 16-dim 觀察空間)
  learning_rate: 0.0003             # 稍微提高學習率
  batch_size: 512                   # 增大 batch size（更穩定）
  buffer_size: 2000000              # 增大 replay buffer
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 2                 # 每步更新 2 次（更充分利用數據）
  ent_coef: "auto"
  target_entropy: "auto"
  learning_starts: 10000            # 延遲開始學習（收集更多經驗）
  
  # 🆕 更大的網路架構（處理更多特徵）
  net_arch: [512, 256, 256]         # 三層更大的網路
  
  # 特徵提取器
  feature_extractor:
    type: "mlp"
    features_dim: 256               # 增大特徵維度
    sequence_length: 20
    lstm_hidden_size: 64
    lstm_num_layers: 1
  
  # 訓練設定
  n_envs: 4
  eval_freq: 5000
  n_eval_episodes: 20
  
  # 🆕 更寬鬆的早停設定（給更多時間學習）
  early_stopping:
    enabled: true
    patience: 40                    # 20 → 40（更多耐心）
    min_delta: 30.0                 # 降低閾值

# =============================================================================
# Sanity Check 配置
# =============================================================================
sanity_criteria:
  min_rl_net_pnl: 0.0
  min_rl_vs_random_gap: 200.0
  min_rl_vs_baseline_gap: -100.0
  max_retries: 3
  require_positive_sharpe: false
  skip_tuning_if_exceed_baseline: 1.5

# =============================================================================
# 資料切割
# =============================================================================
data_split:
  train_end: 0.5
  valid_end: 0.67

# =============================================================================
# 評估指標配置
# =============================================================================
evaluation:
  primary_metrics:
    - net_pnl
    - sharpe
    - max_drawdown
    - calmar_ratio
  behavior_metrics:
    - avg_spread
    - fill_rate
    - bid_fill_rate
    - ask_fill_rate
    - quote_rate
    - inventory_turnover
  risk_metrics:
    - var_95
    - expected_shortfall_95
    - max_inventory_reached
    - time_at_max_inventory_pct
    - adverse_selection_rate

# =============================================================================
# 驗證配置
# =============================================================================
validation:
  walk_forward:
    enabled: true
    n_splits: 5
    train_window_days: 60
    test_window_days: 15
  monte_carlo:
    enabled: true
    n_simulations: 1000
    confidence_level: 0.95
  robustness:
    enabled: true
    slippage_range: [0.5, 2.0]
    fee_range: [0.5, 2.0]
    volatility_range: [0.5, 2.0]

# =============================================================================
# 集成學習配置
# =============================================================================
ensemble:
  enabled: false
  n_models: 5
  voting_method: "weighted"
  diversity_weight: 0.2

# =============================================================================
# 實驗追蹤
# =============================================================================
run:
  short_name: "v3_robust_tuned"
  notes: |
    Regime-Robust 配置 + 延長訓練 + 超參數調優：
    - 訓練步數 400k（原 200k）
    - 更大網路 [512, 256, 256]
    - 更大 batch size 512
    - 更高學習率 0.0003
    - gradient_steps=2
    - early stopping patience=40
    目標：更充分學習趨勢特徵，提升 OOS 表現
  tags:
    - "v3_robust_tuned"
    - "extended_training"
    - "hyperparameter_tuning"
    - "16dim_observation"
