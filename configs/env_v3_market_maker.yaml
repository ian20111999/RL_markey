# =============================================================================
# MarketMakingEnvV2 配置檔案 (v3_market_maker - 專注真正做市行為)
# 
# 🆕 針對做市策略優化：
# 1. 強化庫存懲罰，避免單邊累積
# 2. 獎勵完成雙向交易
# 3. 更嚴格的對稱報價
# 4. 禁用複雜的成交模型（先學會基本做市）
# =============================================================================

# 基礎環境設定
env:
  id: "MarketMakingEnvV2"
  data_file: "data/btc_usdt_1m_2023.csv"
  
  # 基本參數
  episode_length: 1440              # 1 天 = 1440 分鐘
  initial_cash: 10000.0
  max_inventory: 5.0
  random_start: true
  
  # 市場參數
  fee_rate: 0.0004
  base_spread: 25.0

# =============================================================================
# 數據增強配置
# =============================================================================
data_augmentation:
  enable_price_flip: true           # 價格翻轉（牛熊對稱）

# =============================================================================
# 🆕 簡化成交模型 - 先讓模型學會基本做市
# =============================================================================
fill_model:
  enabled: false                    # 禁用複雜成交模型！先用簡單邏輯

# =============================================================================
# Observation 配置 - 16 維觀察空間
# =============================================================================
observation:
  include_price: true
  include_inventory: true
  include_time: true
  include_volatility: true
  include_momentum: true
  include_volume: true
  include_inventory_age: true
  include_trend: true
  trend_windows: [60, 240, 1440]
  volatility_windows: [5, 15, 60]
  momentum_windows: [5, 15]

# =============================================================================
# 🆕 Reward 配置 - v2 強力庫存控制 + 簡化
# =============================================================================
reward:
  mode: "shaped"
  
  # 🔧 v2: 大幅增強庫存懲罰 (6倍！強迫控制庫存)
  lambda_inventory: 0.03            # 0.005 → 0.03 (6倍加強!)
  lambda_turnover: 0.0              # 不懲罰交易次數
  gamma: 0.99
  sparse_scale: 0.01
  terminal_bonus_weight: 0.3
  
  # 🔧 v2: 簡化獎勵 (移除複雜 bonus，專注基本做市)
  spread_capture_bonus: 0.0         # 移除 (原 0.1)
  round_trip_bonus: 0.0             # 移除 (原 2.0)
  inventory_revert_bonus: 0.5       # 減半 (原 1.0)

# =============================================================================
# Action 配置 - 更對稱的報價
# =============================================================================
action:
  mode: "asymmetric"
  allow_no_quote: false             # 🆕 禁止不報價！必須積極做市
  max_spread_multiplier: 2.0        # 縮小範圍（3.0 → 2.0）
  min_spread_multiplier: 0.5        # 提高最小（0.3 → 0.5）

# =============================================================================
# 動態部位限制配置
# =============================================================================
dynamic_position_limit:
  enabled: true
  volatility_window: 60
  base_volatility: 0.02
  min_inventory_ratio: 0.3
  max_inventory_ratio: 1.0

# =============================================================================
# 禁用 Domain Randomization（先學會基本）
# =============================================================================
domain_randomization:
  enabled: false

# =============================================================================
# 風險敏感訓練配置
# =============================================================================
risk_sensitive:
  enabled: false                    # 先禁用

# =============================================================================
# 訓練配置 - 穩定化版本
# =============================================================================
train:
  algo: "SAC"
  total_timesteps: 200000           # 增加訓練步數
  final_timesteps: 300000
  
  # SAC 超參數 - 🔧 穩定化修改
  learning_rate: 0.0001             # 🔧 降低 (原 0.0003)
  batch_size: 256
  buffer_size: 500000
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  ent_coef: 0.1                     # 🔧 固定值 (原 "auto" 導致爆炸)
  target_entropy: "auto"
  learning_starts: 10000            # 🔧 增加 (原 5000)
  
  # 網路架構
  net_arch: [256, 256]
  
  # 訓練設定
  n_envs: 4
  eval_freq: 5000
  n_eval_episodes: 10
  
  # Early Stopping
  early_stopping:
    enabled: true
    patience: 25                    # 🔧 增加耐心
    min_delta: 50.0

# =============================================================================
# Sanity Check 配置
# =============================================================================
sanity_criteria:
  min_rl_net_pnl: 0.0
  min_rl_vs_random_gap: 200.0
  min_rl_vs_baseline_gap: -100.0
  max_retries: 3
  require_positive_sharpe: false

# =============================================================================
# 資料切割
# =============================================================================
data_split:
  train_end: 0.5
  valid_end: 0.67

# =============================================================================
# 實驗追蹤
# =============================================================================
run:
  short_name: "v3_market_maker_v2"
  notes: |
    v2 優化版：強力庫存控制 + 簡化 reward
    - 6倍庫存懲罰 (lambda_inventory: 0.03)
    - 移除 spread_capture_bonus 和 round_trip_bonus
    - 減半 inventory_revert_bonus
    - 保持 ent_coef=0.1 穩定
    - 目標：控制 MaxInv < 5.0，雙向做市
  tags:
    - "v3_market_maker_v2"
    - "strong_inventory_control"
    - "simplified_reward"
