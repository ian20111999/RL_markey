# =============================================================================
# MarketMakingEnvV2 配置檔案 (v3_robust - Regime-Robust Market Making)
# 
# 🆕 關鍵改進:
# 1. 加入趨勢特徵 (include_trend) - 讓模型感知市場狀態
# 2. 數據增強 (enable_price_flip) - 從牛市數據創造熊市數據
# 3. 更強的 Domain Randomization - 增加泛化能力
# =============================================================================

# 基礎環境設定
env:
  id: "MarketMakingEnvV2"
  data_file: "data/btc_usdt_1m_2023.csv"
  
  # 基本參數
  episode_length: 1440              # 1 天 = 1440 分鐘
  initial_cash: 10000.0
  max_inventory: 5.0
  random_start: true
  
  # 市場參數
  fee_rate: 0.0004
  base_spread: 25.0

# =============================================================================
# 🆕 數據增強配置 - 解決 Regime Change 問題
# =============================================================================
data_augmentation:
  # 價格翻轉：將上漲數據轉換為下跌數據
  enable_price_flip: true           # 🔥 關鍵開關
  
  # 未來擴展
  # enable_noise_injection: false   # 添加隨機噪聲
  # noise_std: 0.001                # 噪聲標準差

# =============================================================================
# 真實成交模型配置
# =============================================================================
fill_model:
  enabled: true
  mode: "custom"
  slippage_bps: 1.0
  max_slippage_bps: 5.0
  use_queue_position: true
  queue_decay_rate: 0.1
  initial_queue_position: 0.7
  allow_partial_fills: true
  min_fill_ratio: 0.3
  market_impact_factor: 0.1
  adverse_selection_prob: 0.3
  adverse_selection_cost_bps: 2.0

# =============================================================================
# 進階觀察空間配置
# =============================================================================
advanced_observation:
  use_order_flow: true
  order_flow_window: 20
  use_vwap_deviation: true
  vwap_window: 30
  use_momentum: true
  momentum_windows: [5, 15, 60]

# =============================================================================
# Reward 配置
# =============================================================================
reward:
  mode: "shaped"
  lambda_inventory: 0.005
  lambda_turnover: 0.0001
  gamma: 0.99
  sparse_scale: 0.01
  terminal_bonus_weight: 0.3

# =============================================================================
# 風險敏感訓練配置
# =============================================================================
risk_sensitive:
  enabled: true
  risk_type: "cvar"
  risk_lambda: 0.1
  cvar_alpha: 0.05
  use_cvar_callback: true
  target_cvar: -500.0
  use_drawdown_early_stopping: true
  max_drawdown_threshold: 0.3

# =============================================================================
# 🆕 Observation 配置 - 加入趨勢特徵
# =============================================================================
observation:
  include_price: true
  include_inventory: true
  include_time: true
  include_volatility: true
  include_momentum: true
  include_volume: true
  include_inventory_age: true
  
  # 🔥 趨勢特徵 - 幫助模型感知市場狀態 (Bull/Bear/Sideways)
  include_trend: true               # 🆕 啟用趨勢特徵
  trend_windows: [60, 240, 1440]    # 1小時, 4小時, 1天 SMA
  
  volatility_windows: [5, 15, 60]
  momentum_windows: [5, 15]

# =============================================================================
# Action 配置
# =============================================================================
action:
  mode: "asymmetric"
  allow_no_quote: false
  max_spread_multiplier: 3.0
  min_spread_multiplier: 0.3

# =============================================================================
# 動態部位限制配置
# =============================================================================
dynamic_position_limit:
  enabled: true
  volatility_window: 60
  base_volatility: 0.02
  min_inventory_ratio: 0.3
  max_inventory_ratio: 1.0

# =============================================================================
# 🆕 Domain Randomization 配置 - 增強版
# =============================================================================
domain_randomization:
  enabled: true
  
  # 更寬的隨機化範圍 - 提高泛化能力
  fee_rate_range: [0.0002, 0.0006]      # 更寬範圍
  base_spread_range: [15.0, 40.0]       # 更寬範圍
  volatility_multiplier_range: [0.6, 1.5]  # 更寬範圍
  fill_probability_noise: 0.1           # 更多噪聲

# =============================================================================
# 訓練配置
# =============================================================================
train:
  algo: "SAC"
  
  # 訓練步數 - 因為數據翻倍，適當增加
  total_timesteps: 200000           # 標準訓練
  final_timesteps: 400000           # Final Training
  
  # SAC 超參數
  learning_rate: 0.0001
  batch_size: 256
  buffer_size: 1000000              # 增大 buffer 以容納更多數據
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  ent_coef: "auto"
  target_entropy: "auto"
  
  # 網路架構 - 稍大以處理更多特徵
  net_arch: [256, 256]
  
  # 特徵提取器
  feature_extractor:
    type: "mlp"
    features_dim: 128
    sequence_length: 20
    lstm_hidden_size: 64
    lstm_num_layers: 1
  
  # 訓練設定
  n_envs: 4
  eval_freq: 5000
  n_eval_episodes: 20
  
  # 早停
  early_stopping:
    enabled: true
    patience: 20                    # 增加耐心（數據量增加）
    min_delta: 50.0

# =============================================================================
# Sanity Check 配置
# =============================================================================
sanity_criteria:
  min_rl_net_pnl: 0.0
  min_rl_vs_random_gap: 200.0
  min_rl_vs_baseline_gap: -100.0
  max_retries: 3
  require_positive_sharpe: false
  skip_tuning_if_exceed_baseline: 1.5

# =============================================================================
# 資料切割 - 使用比例以適應增強後的數據
# =============================================================================
data_split:
  train_end: 0.5                    # 50% 訓練 (會被數據增強翻倍)
  valid_end: 0.67                   # 17% 驗證

# =============================================================================
# 評估指標配置
# =============================================================================
evaluation:
  primary_metrics:
    - net_pnl
    - sharpe
    - max_drawdown
    - calmar_ratio
  behavior_metrics:
    - avg_spread
    - fill_rate
    - bid_fill_rate
    - ask_fill_rate
    - quote_rate
    - inventory_turnover
  risk_metrics:
    - var_95
    - expected_shortfall_95
    - max_inventory_reached
    - time_at_max_inventory_pct
    - adverse_selection_rate

# =============================================================================
# 驗證配置
# =============================================================================
validation:
  walk_forward:
    enabled: true
    n_splits: 5
    train_window_days: 60
    test_window_days: 15
  monte_carlo:
    enabled: true
    n_simulations: 1000
    confidence_level: 0.95
  robustness:
    enabled: true
    slippage_range: [0.5, 2.0]
    fee_range: [0.5, 2.0]
    volatility_range: [0.5, 2.0]

# =============================================================================
# 集成學習配置
# =============================================================================
ensemble:
  enabled: false
  n_models: 5
  voting_method: "weighted"
  diversity_weight: 0.2

# =============================================================================
# 實驗追蹤
# =============================================================================
run:
  short_name: "v3_robust"
  notes: |
    Regime-Robust 配置：
    - 🆕 趨勢特徵 (1h/4h/1d SMA) 讓模型感知市場狀態
    - 🆕 數據增強 (Price Flip) 從牛市創造熊市數據
    - 🆕 更強的 Domain Randomization
    目標：解決訓練/測試數據 regime change 問題
  tags:
    - "v3_robust"
    - "regime_aware"
    - "trend_features"
    - "data_augmentation"
    - "generalization"
