# =============================================================================
# MarketMakingEnvV2 配置檔案 (v3_normalized - Reward 標準化版)
# 
# 🆕 v3 關鍵修改：
# 1. reward_scale=0.001 將獎勵標準化到合理範圍
# 2. 恢復適中的 lambda_inventory（0.01，比 v2 的 0.03 低）
# 3. 保留簡化的獎勵結構
# 4. 目標：穩定 critic_loss，改善訓練穩定性
# =============================================================================

# 基礎環境設定
env:
  id: "MarketMakingEnvV2"
  data_file: "data/btc_usdt_1m_2023.csv"
  
  # 基本參數
  episode_length: 1440              # 1 天 = 1440 分鐘
  initial_cash: 10000.0
  max_inventory: 5.0
  random_start: true
  
  # 市場參數
  fee_rate: 0.0004
  base_spread: 25.0

# =============================================================================
# 數據增強配置
# =============================================================================
data_augmentation:
  enable_price_flip: true           # 價格翻轉（牛熊對稱）

# =============================================================================
# 簡化成交模型
# =============================================================================
fill_model:
  enabled: false                    # 禁用複雜成交模型

# =============================================================================
# Observation 配置 - 16 維觀察空間
# =============================================================================
observation:
  include_price: true
  include_inventory: true
  include_time: true
  include_volatility: true
  include_momentum: true
  include_volume: true
  include_inventory_age: true
  include_trend: false            # 🔧 禁用趨勢特徵，防止投機
  trend_windows: [60, 240, 1440]
  volatility_windows: [5, 15, 60]
  momentum_windows: [5, 15]

# =============================================================================
# 🆕 Reward 配置 - v3 標準化獎勵
# =============================================================================
reward:
  mode: "shaped"
  
  # 🔧 v3: 標準化獎勵！關鍵修改
  reward_scale: 0.001               # 將獎勵縮放 1000 倍（±3000 → ±3）
  
  # 🔧 v3: 核彈級庫存懲罰 (2.0 -> 10.0)
  # 強制 Agent 必須清倉，不能持有庫存
  lambda_inventory: 10.0            # 核彈級懲罰
  lambda_turnover: 0.0              # 不懲罰交易次數
  gamma: 0.99
  sparse_scale: 0.01
  terminal_bonus_weight: 0.3
  
  # 簡化獎勵（保持 v2 的設定）
  spread_capture_bonus: 0.0
  round_trip_bonus: 0.0
  inventory_revert_bonus: 0.5       # 保留庫存回歸獎勵

# =============================================================================
# Action 配置 - 對稱報價
# =============================================================================
action:
  mode: "asymmetric"
  allow_no_quote: false
  max_spread_multiplier: 2.0
  min_spread_multiplier: 0.5

# =============================================================================
# 動態部位限制配置
# =============================================================================
dynamic_position_limit:
  enabled: true
  volatility_window: 60
  volatility_threshold: 0.0005      # 🔧 修正：0.02 -> 0.0005 (0.05%)，適應 1-min 波動率
  min_inventory_ratio: 0.2          # 🔧 允許更嚴格的限制 (0.3 -> 0.2)
  max_inventory_ratio: 1.0

# =============================================================================
# 禁用 Domain Randomization
# =============================================================================
domain_randomization:
  enabled: false

# =============================================================================
# 風險敏感訓練配置
# =============================================================================
risk_sensitive:
  enabled: false

# =============================================================================
# 訓練配置 - v3 穩定化版本
# =============================================================================
train:
  algo: "SAC"
  total_timesteps: 200000
  final_timesteps: 300000
  
  # SAC 超參數
  learning_rate: 0.0003             # 恢復正常學習率（v2=0.0001 太慢）
  batch_size: 256
  buffer_size: 500000
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  ent_coef: 0.1                     # 固定值
  target_entropy: "auto"
  learning_starts: 10000
  
  # 網路架構
  net_arch: [256, 256]
  
  # 訓練設定
  n_envs: 4
  eval_freq: 5000
  n_eval_episodes: 10
  
  # Early Stopping
  early_stopping:
    enabled: true
    patience: 25
    min_delta: 0.05                 # 🔧 縮小到 0.05（因為獎勵已標準化）

# =============================================================================
# Sanity Check 配置
# =============================================================================
sanity_criteria:
  min_rl_net_pnl: 0.0
  min_rl_vs_random_gap: 0.2         # 🔧 縮小（因為獎勵已標準化）
  min_rl_vs_baseline_gap: -0.1
  max_retries: 3
  require_positive_sharpe: false

# =============================================================================
# 資料切割
# =============================================================================
data_split:
  train_end: 0.5
  valid_end: 0.67

# =============================================================================
# 實驗追蹤
# =============================================================================
run:
  short_name: "v3_normalized"
  notes: |
    v3 優化版：Reward 標準化
    - reward_scale=0.001 將獎勵標準化（關鍵！解決 critic_loss 爆炸）
    - lambda_inventory=0.01（適中）
    - 恢復正常 learning_rate=0.0003
    - 目標：穩定訓練，控制 MaxInv，正向 OOS PnL
  tags:
    - "v3_normalized"
    - "reward_scaling"
    - "stable_training"
